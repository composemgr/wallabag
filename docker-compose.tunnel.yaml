name: wallabag
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: wallabag/wallabag:latest
    container_name: wallabag-app
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: wallabag-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      SYMFONY__ENV__DOMAIN_NAME: http://${BASE_HOST_NAME:-$HOSTNAME}
      SYMFONY__ENV__DATABASE_DRIVER: pdo_pgsql
      SYMFONY__ENV__DATABASE_HOST: wallabag-db
      SYMFONY__ENV__DATABASE_PORT: 5432
      SYMFONY__ENV__DATABASE_NAME: ${DB_CREATE_DATABASE_NAME:-wallabag}
      SYMFONY__ENV__DATABASE_USER: ${DB_USER_NAME:-wallabag}
      SYMFONY__ENV__DATABASE_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
      SYMFONY__ENV__SECRET: ${APP_SECRET_KEY:-replace-with-a-random-16-byte-hex-string}
      SYMFONY__ENV__MAILER_DSN: smtp://${EMAIL_SERVER_LOGIN_NAME:-}:${EMAIL_SERVER_LOGIN_PASS:-}@${EMAIL_SERVER_HOST:-172.17.0.1}:${EMAIL_SERVER_PORT:-587}
      SYMFONY__ENV__FROM_EMAIL: ${EMAIL_SERVER_MAIL_FROM:-no-reply@example.com}
    volumes:
      - './volumes/data/wallabag:/var/www/wallabag/data:z'
      - './volumes/data/wallabag/images:/var/www/wallabag/web/assets/images:z'
    depends_on:
      wallabag-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:80']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'cloudflare.enable=true'
      - 'cloudflare.service=http://wallabag-app:80'
      - 'cloudflare.hostname=${BASE_HOST_NAME:-$HOSTNAME}'
    networks:
      - wallabag
      - cloudflare

  wallabag-db:
    image: postgres:latest
    container_name: wallabag-db
    hostname: wallabag-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: wallabag-db
      POSTGRES_DB: ${DB_CREATE_DATABASE_NAME:-wallabag}
      POSTGRES_USER: ${DB_USER_NAME:-wallabag}
      POSTGRES_PASSWORD: ${DB_USER_PASS:-replace-with-a-random-password}
    volumes:
      - './volumes/db/postgres/wallabag:/var/lib/postgresql/data:z'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wallabag

networks:
  wallabag:
    name: wallabag
    external: false
  cloudflare:
    external: true
